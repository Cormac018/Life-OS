<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1020">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <meta name="description" content="Your private life planner and lifelong record.">
<link rel="manifest" href="./manifest.json?v=64">
<link rel="icon" href="./icon-192.png?v=64">
<title>Life OS</title>
  <link rel="stylesheet" href="./life-app.css?v=64">
</head>
<body>
  <div class="preview-bar live-status"><button id="workspaceStatus" type="button" data-action="workspace-settings" aria-live="polite">Opening your private workspace...</button><button id="updateButton" type="button" hidden>Update ready</button></div>
  <div class="app">
    <aside class="sidebar">
      <button class="brand" data-action="navigate" data-route="today" aria-label="Life OS, Today"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">life os</span></button>
      <nav id="desktopNav" aria-label="Main navigation"></nav>
      <div class="sidebar-foot" id="privacyNote"></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="topbar-label"><strong id="breadcrumb">Your day</strong><span> / Life OS</span></div><div class="topbar-actions"><button class="pill" data-action="workspace-settings" aria-label="Storage, backups and app settings"><span class="dot"></span>v64</button><button class="icon-button" data-action="add-event" aria-label="Add to your day" id="addEventButton"></button><div class="avatar" aria-label="Personal workspace">ME</div></div></header>
      <main class="main" id="main"><h1>Your life, kept here.</h1><p>Opening the private database on this device...</p></main>
    </div>
  </div>
  <nav class="bottom-nav" id="mobileNav" aria-label="Main navigation"></nav>
  <dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-inner" id="dialogContent"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./lifeos-storage.js?v=64" defer></script>
<script src="./db.js?v=64" data-lifeos-client="workspace" defer></script>
<script src="./lifeos-purchases.js?v=64" defer></script>
<script src="./lifeos-workspace.js?v=64" defer></script>
<script src="./lifeos-writers.js?v=64" defer></script>
<script src="./lifeos-vault.js?v=64" defer></script>
<script src="./lifeos-runtime.js?v=64" defer></script>
<script src="./lifeos-purchase-ui.js?v=64" defer></script>
<script src="./life-app.js?v=64" defer></script>
<noscript>Life OS needs JavaScript to open your on-device records.</noscript>
</body>
</html>
